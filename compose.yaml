services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./.storage/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis_http_proxy:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${KV_REST_API_TOKEN:-srhtoken}
      SRH_CONNECTION_STRING: redis://redis:6379
      SRH_MAX_CONNECTIONS: 100
    ports:
      - "127.0.0.1:6380:80"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: .
    image: arcpay:local
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file: .env
    environment:
      NODE: "true"
      PORT: 3000
      KV_REST_API_URL: http://redis_http_proxy
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-srhtoken}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      redis_http_proxy:
        condition: service_started
    restart: unless-stopped

  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.storage/caddy/data:/data
      - ./.storage/caddy/config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
